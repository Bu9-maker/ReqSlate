<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>项目总览</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/style.css">
</head>
<body>

<div class="topbar">
  <div class="inner">
    <h1 id="appname"></h1>
    <div class="spacer"></div>
    <span class="sub" id="count"></span>
    <button class="btn sm ghost" id="logout">退出</button>
  </div>
</div>

<div class="wrap">
  <div class="row" style="margin-bottom:16px">
    <button class="btn primary" id="newProj">+ 新建项目</button>
  </div>

  <div id="list"></div>
  <div class="foot">
    <div id="foot"></div>
    <div id="footsub" class="footsub"></div>
  </div>
</div>

<div class="modal" id="mbg" hidden>
  <div class="mbox">
    <div class="mhead">
      <h3 id="mtitle">新建项目</h3>
      <button class="mclose" id="m-close" type="button" title="关闭">×</button>
    </div>
    <div class="mbody">
      <label class="f"><span>项目名称</span><input type="text" id="f-name" placeholder="请输入项目名称" maxlength="60"></label>
      <label class="f" style="margin-bottom:0"><span>备注（可不填）</span><input type="text" id="f-note" placeholder="请输入备注" maxlength="120"></label>
      <div class="err" id="m-err"></div>
    </div>
    <div class="mfoot">
      <button class="btn ghost sm" id="m-cancel">取消</button>
      <button class="btn primary sm" id="m-save">保存</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const $ = (s) => document.querySelector(s);
let editingId = null;

let CFG = {
  appName: 'ReqSlate',
  overviewTitle: '项目总览',
  boardTitle: '工作任务清单',
  titleSeparator: ' · ',
  footerText: 'ReqSlate',
  footerSub: 'designed by zhouwh',
  loginHint: '请输入管理密码'
};

function toast(msg) {
  const t = $('#toast');
  t.textContent = msg;
  t.classList.add('on');
  clearTimeout(t._h);
  t._h = setTimeout(() => t.classList.remove('on'), 2200);
}

function openModal(title, name, note) {
  $('#mtitle').textContent = title;
  $('#f-name').value = name || '';
  $('#f-note').value = note || '';
  $('#m-err').textContent = '';
  $('#mbg').hidden = false;
  $('#f-name').focus();
  $('#f-name').select();
}

function closeModal() {
  $('#mbg').hidden = true;
}

function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

async function api(path, opts = {}) {
  const r = await fetch(path, {
    ...opts,
    headers: { 'Content-Type': 'application/json', ...(opts.headers || {}) }
  });
  if (r.status === 401) { location.href = '/'; throw new Error('未登录'); }
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || '请求失败');
  return j;
}

async function load() {
  const j = await api('/api/projects');
  const box = $('#list');
  $('#count').textContent = j.projects.length ? `共 ${j.projects.length} 个项目` : '';

  if (!j.projects.length) {
    box.innerHTML = '<div class="empty-state">还没有项目。点左上角「新建项目」开始。</div>';
    return;
  }

  box.innerHTML = '<div class="proj-list">' + j.projects.map((p) => {
    const s = p.stats;
    const link = location.origin + '/p/' + p.token;
    return `
      <div class="proj" data-id="${p.id}">
        <div>
          <h3>${esc(p.name)}</h3>
          ${p.note ? `<p class="note">${esc(p.note)}</p>` : ''}
        </div>
        <div class="nums">
          <span>共 <b>${s.total}</b> 项</span>
          <span>已完成 <b style="color:var(--done)">${s.done}</b></span>
          <span>进行中 <b style="color:var(--doing)">${s.doing}</b></span>
          <span>未开始 <b>${s.todo}</b></span>
          ${s.overdue ? `<span class="od">逾期 <b>${s.overdue}</b></span>` : ''}
        </div>
        <div class="link">
          <input type="text" readonly value="${esc(link)}" data-link>
          <button class="btn sm" data-copy>复制</button>
        </div>
        <div class="row">
          <a class="btn sm primary" href="/p/${p.token}" target="_blank">打开</a>
          <button class="btn sm" data-edit>改名</button>
          <button class="btn sm danger" data-del>删除</button>
        </div>
      </div>`;
  }).join('') + '</div>';

  box.querySelectorAll('.proj').forEach((el) => {
    const id = Number(el.dataset.id);
    const proj = j.projects.find((x) => x.id === id);

    el.querySelector('[data-copy]').addEventListener('click', async () => {
      const v = el.querySelector('[data-link]').value;
      try {
        await navigator.clipboard.writeText(v);
        toast('链接已复制');
      } catch {
        el.querySelector('[data-link]').select();
        document.execCommand('copy');
        toast('链接已复制');
      }
    });

    el.querySelector('[data-edit]').addEventListener('click', () => {
      editingId = id;
      openModal('修改项目', proj.name, proj.note);
    });

    el.querySelector('[data-del]').addEventListener('click', async () => {
      if (!confirm(`确定删除项目「${proj.name}」？该项目下所有任务和记录都会一起删除，无法恢复。`)) return;
      await api('/api/projects/' + id, { method: 'DELETE' });
      toast('已删除');
      load();
    });
  });
}

$('#newProj').addEventListener('click', () => {
  editingId = null;
  openModal('新建项目', '', '');
});

$('#m-close').addEventListener('click', closeModal);
$('#m-cancel').addEventListener('click', closeModal);
$('#mbg').addEventListener('click', (e) => { if (e.target === $('#mbg')) closeModal(); });
document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && !$('#mbg').hidden) closeModal(); });

$('#m-save').addEventListener('click', async () => {
  const name = $('#f-name').value.trim();
  if (!name) { $('#m-err').textContent = '请输入项目名称'; return; }
  const body = JSON.stringify({ name, note: $('#f-note').value.trim() });
  try {
    if (editingId) await api('/api/projects/' + editingId, { method: 'PATCH', body });
    else await api('/api/projects', { method: 'POST', body });
    closeModal();
    toast(editingId ? '已保存' : '项目已创建');
    load();
  } catch (e) {
    $('#m-err').textContent = e.message;
  }
});

$('#f-name').addEventListener('keydown', (e) => { if (e.key === 'Enter') $('#m-save').click(); });

$('#logout').addEventListener('click', async () => {
  await fetch('/api/logout', { method: 'POST' });
  location.href = '/';
});

async function boot() {
  try { CFG = { ...CFG, ...(await api('/api/config')) }; } catch {}
  $('#appname').textContent = CFG.appName + CFG.titleSeparator + CFG.overviewTitle;
  document.title = CFG.appName + CFG.titleSeparator + CFG.overviewTitle;
  $('#foot').textContent = CFG.footerText;
  $('#footsub').textContent = CFG.footerSub || '';
  await load();
}

boot();
</script>
</body>
</html>
